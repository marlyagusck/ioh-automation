main:
  steps:

    - getProjects:
        call: http.get
        args:
          url: https://finops-top-project-393352745253.asia-southeast2.run.app/run
          auth:
            type: OIDC
        result: projectResult

    - processProjects:
        for:
          value: project
          in: ${projectResult.body.projects}
          steps:

            - collectQueries:
                call: http.post
                args:
                  url: https://finops-query-collector-393352745253.asia-southeast2.run.app/run
                  auth:
                    type: OIDC
                  body:
                    project_id: ${project.project_id}
                    project_name: ${project.project_name}
                result: collectorResult

    - analyzeQueries:
        call: http.get
        args:
          url: https://finops-ai-analyzer-393352745253.asia-southeast2.run.app/run
          auth:
            type: OIDC
        result: analyzerResult

    - done:
        return:
          status: SUCCESS
          projects_processed: ${len(projectResult.body.projects)}
          analyzer_response: ${analyzerResult.body}